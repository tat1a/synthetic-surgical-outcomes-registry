name: Rebuild and validate synthetic registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild generated examples
        run: python -m src.build
      - name: Rebuild Power BI project
        run: python -m src.build_powerbi
      - name: Verify committed text outputs are reproducible
        run: git diff --exit-code -- data/generation_manifest.json data/injected_errors.csv reports/ powerbi/
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
